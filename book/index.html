<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book | At9</title>
    <meta name="description" content="Book a room, table or appointment with At9." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#907CFF" />
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="../assets/icons/favicon-96x96.png" />
    <link rel="shortcut icon" href="../assets/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="../assets/icons/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <!-- Stripe.js must be loaded from Stripe's own domain, never bundled or
         self-hosted — that is what keeps card details out of this page and off
         At9's servers, and what keeps the business inside PCI scope SAQ-A. -->
    <script src="https://js.stripe.com/v3/"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --primary:      #18181b;
        --primary-h:    #3f3f46;
        --accent:       #2563eb;
        --accent-h:     #1d4ed8;
        --accent-bg:    #eff6ff;
        --accent-mid:   #bfdbfe;
        --bg:           #f4f4f5;
        --surface:      #ffffff;
        --border:       #e4e4e7;
        --text:         #18181b;
        --text-2:       #71717a;
        --text-3:       #a1a1aa;
        --success:      #16a34a;
        --success-mid:  #bbf7d0;
        --success-bg:   #f0fdf4;
        --error:        #dc2626;
        --error-bg:     #fef2f2;
        --r-sm:  6px;
        --r-md:  10px;
        --r-lg:  14px;
        --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Page shell ─────────────────────────────────────────────────────────── */
      .page { min-height: 100vh; display: flex; flex-direction: column; }

      /* ── Header ─────────────────────────────────────────────────────────────── */
      .header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 18px 24px 20px;
        text-align: center;
      }
      .header-eyebrow {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-3);
        margin-bottom: 5px;
      }
      .header-org {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.2;
      }

      /* ── Content area ───────────────────────────────────────────────────────── */
      .content {
        flex: 1;
        max-width: 480px;
        width: 100%;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      /* ── Card ───────────────────────────────────────────────────────────────── */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow);
        padding: 20px;
        margin-bottom: 12px;
      }

      /* ── Section label ──────────────────────────────────────────────────────── */
      .section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-2);
        margin-bottom: 12px;
      }

      /* ── Booking type grid ──────────────────────────────────────────────────── */
      .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .type-card {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: var(--r-md);
        padding: 22px 14px 18px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s, box-shadow 0.15s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .type-card:hover {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-bg);
      }
      .type-card-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--accent-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
      }
      .type-card-label { font-size: 14px; font-weight: 600; color: var(--text); }
      .type-card-sub   { font-size: 12px; color: var(--text-2); margin-top: -4px; }

      /* ── Calendar ───────────────────────────────────────────────────────────── */
      .cal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .cal-month { font-size: 14px; font-weight: 600; color: var(--text); }
      .cal-nav {
        background: none;
        border: 1px solid var(--border);
        cursor: pointer;
        width: 30px;
        height: 30px;
        border-radius: var(--r-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: var(--text-2);
        transition: border-color 0.12s, color 0.12s;
      }
      .cal-nav:hover { border-color: var(--accent); color: var(--accent); }
      .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
      .cal-weekday {
        text-align: center;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-3);
        padding: 4px 0 8px;
      }
      .cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
      .cal-day {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.1s, color 0.1s;
        color: var(--text);
        border: none;
        background: none;
        font-family: inherit;
      }
      .cal-day { -webkit-tap-highlight-color: transparent; }
      .cal-day:hover:not(:disabled) { background: var(--accent-bg); color: var(--accent); }
      .cal-day:disabled { color: var(--text-3); cursor: default; }
      .cal-day.today { font-weight: 700; }

      /* ── Date summary bar ───────────────────────────────────────────────────── */
      .date-bar {
        display: flex;
        margin-top: 14px;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        overflow: hidden;
        background: var(--bg);
      }
      .date-bar-item { flex: 1; padding: 10px 14px; }
      .date-bar-item + .date-bar-item { border-left: 1px solid var(--border); }
      .date-bar-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-3);
        margin-bottom: 3px;
      }
      .date-bar-value         { font-size: 13px; font-weight: 600; color: var(--text); }
      .date-bar-value.empty   { color: var(--text-3); font-weight: 400; }
      .date-bar-mid {
        display: flex;
        align-items: center;
        padding: 0 10px;
        font-size: 11px;
        color: var(--text-3);
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }

      /* ── Date strip (table booking) ─────────────────────────────────────────── */
      .date-strip-hdr {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }
      .date-strip-hdr-label {
        flex: 1;
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
      }
      .strip-nav-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 6px 10px;
        font-size: 22px;
        color: var(--text-2);
        transition: color 0.12s;
        line-height: 1;
      }
      .strip-nav-btn:hover:not(:disabled) { color: var(--accent); }
      .strip-nav-btn:active:not(:disabled) { opacity: 0.5; }
      .strip-nav-btn:disabled { opacity: 0.25; cursor: default; }
      .date-strip-wrap {
        display: flex;
        align-items: stretch;
        gap: 4px;
      }
      .strip-side-btn {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: var(--r-sm);
        cursor: pointer;
        padding: 0 10px;
        color: var(--text-2);
        font-size: 20px;
        line-height: 1;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        transition: border-color 0.12s, color 0.12s;
      }
      .strip-side-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      .strip-side-btn:active:not(:disabled) { opacity: 0.5; }
      .strip-side-btn:disabled { opacity: 0.25; cursor: default; }
      .date-strip {
        flex: 1;
        min-width: 0;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .date-strip::-webkit-scrollbar { display: none; }
      .date-chip {
        min-width: 60px;
        padding: 8px 4px;
        border-radius: var(--r-sm);
        border: 1.5px solid var(--border);
        background: var(--surface);
        text-align: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: border-color 0.12s, background 0.12s;
      }
      .date-chip:hover { border-color: var(--accent); }
      .date-chip.selected { border-color: var(--accent); background: var(--accent); }
      .date-chip-day { font-size: 10px; font-weight: 600; color: var(--text-2); text-transform: uppercase; }
      .date-chip-num { font-size: 17px; font-weight: 700; color: var(--text); margin-top: 1px; }
      .date-chip.selected .date-chip-day,
      .date-chip.selected .date-chip-num { color: #fff; }

      /* ── Time slots ─────────────────────────────────────────────────────────── */
      .slot-period {
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-3);
        margin-bottom: 8px;
      }
      .slot-grid { display: flex; flex-wrap: wrap; gap: 6px; }
      .slot {
        padding: 7px 13px;
        border-radius: var(--r-sm);
        border: 1.5px solid var(--border);
        background: var(--surface);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        color: var(--text);
        transition: border-color 0.12s, background 0.12s, color 0.12s;
      }
      .slot:hover    { border-color: var(--accent); color: var(--accent); }
      .slot.selected { border-color: var(--accent); background: var(--accent); color: #fff; }

      /* ── Guests counter ─────────────────────────────────────────────────────── */
      .guests-row { display: flex; align-items: center; gap: 14px; }
      .guests-label { flex: 1; font-size: 14px; color: var(--text); }
      .guests-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1.5px solid var(--border);
        background: var(--surface);
        font-family: inherit;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        transition: border-color 0.12s, color 0.12s;
      }
      .guests-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      .guests-btn:disabled { color: var(--text-3); cursor: default; }
      .guests-count { font-size: 16px; font-weight: 700; min-width: 24px; text-align: center; }

      /* ── Form ───────────────────────────────────────────────────────────────── */
      .form-field { margin-bottom: 12px; }
      .form-label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-2);
        margin-bottom: 5px;
      }
      .form-input {
        width: 100%;
        padding: 10px 12px;
        border: 1.5px solid var(--border);
        border-radius: var(--r-sm);
        font-family: inherit;
        font-size: 14px;
        background: var(--surface);
        color: var(--text);
        outline: none;
        transition: border-color 0.12s;
      }
      .form-input:focus { border-color: var(--accent); }
      .form-input::placeholder { color: var(--text-3); }

      /* ── Buttons ────────────────────────────────────────────────────────────── */
      .btn {
        width: 100%;
        padding: 12px 16px;
        border-radius: var(--r-md);
        border: none;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.1s;
      }
      .btn:active { transform: scale(0.98); }
      .btn-primary { background: var(--primary); color: #fff; }
      .btn-primary:hover { opacity: 0.85; }
      .btn-primary:disabled {
        background: var(--border);
        color: var(--text-3);
        cursor: default;
        transform: none;
        opacity: 1;
      }
      .btn-ghost {
        background: none;
        border: 1.5px solid var(--border);
        color: var(--text-2);
      }
      .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

      /* ── Summary strip ──────────────────────────────────────────────────────── */
      .summary {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        padding: 10px 14px;
        margin-bottom: 14px;
        font-size: 13px;
        color: var(--text-2);
        line-height: 1.7;
      }

      /* ── Availability status ───────────────────────────────────────────────── */
      .avail-box {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: var(--r-sm);
        font-size: 13px;
        margin-top: 8px;
      }
      .avail-checking  { background: var(--bg); border: 1px solid var(--border); }
      .avail-ok        { background: var(--success-bg); border: 1px solid var(--success-mid); }
      .avail-none      { background: var(--error-bg); border: 1px solid #fecaca; }
      .avail-main      { font-weight: 600; }
      .avail-sub       { font-size: 12px; color: var(--text-2); margin-top: 2px; }
      .avail-spinner   {
        width: 18px; height: 18px; flex-shrink: 0;
        border: 2px solid var(--border); border-top-color: var(--accent);
        border-radius: 50%; animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Confirmation ───────────────────────────────────────────────────────── */
      .confirm-icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--success-bg);
        color: var(--success);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
      }
      .confirm-title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 8px; }
      .confirm-sub   { font-size: 14px; color: var(--text-2); text-align: center; line-height: 1.5; margin-bottom: 20px; }

      /* ── Loading / error states ─────────────────────────────────────────────── */
      .state-center {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 220px;
        flex-direction: column;
        gap: 14px;
        text-align: center;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.65s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Back button ────────────────────────────────────────────────────────── */
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-2);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        margin-bottom: 16px;
        transition: color 0.12s;
      }
      .back-btn:hover { color: var(--accent); }

      @media (max-width: 340px) { .type-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <noscript>
      <div style="font-family:sans-serif;text-align:center;padding:2rem;">
        <p>JavaScript is required to use the booking system. Please enable JavaScript in your browser settings and reload the page.</p>
      </div>
    </noscript>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const WS_URI = "https://ws.at9.app";
      //const WS_URI = "http://localhost:3000";
      const WEEKDAYS = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];

      // ── UTC helpers ───────────────────────────────────────────────────────────
      const utcMidnight = (d) =>
        new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
      const utcStartOfMonth = (d) =>
        new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1));
      const utcDaysInMonth = (d) =>
        new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
      const utcAddMonths = (d, n) =>
        new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1));
      const utcIsSameDay = (a, b) =>
        a.getUTCFullYear() === b.getUTCFullYear() &&
        a.getUTCMonth() === b.getUTCMonth() &&
        a.getUTCDate() === b.getUTCDate();
      const utcAfter  = (a, b) => utcMidnight(a) > utcMidnight(b);
      const utcBefore = (a, b) => utcMidnight(a) < utcMidnight(b);

      // Classify fetch errors so users see a useful message:
      //  - thrown TypeError -> network/offline
      //  - 4xx with body.message -> use that (server-supplied validation/capacity hint)
      //  - 409 -> slot/capacity gone
      //  - other 4xx -> generic validation
      //  - 5xx -> server problem
      const friendlyError = async (resOrErr) => {
        if (resOrErr instanceof Error) {
          return "Couldn't reach the server. Check your connection and try again.";
        }
        const status = resOrErr.status;
        const data = await resOrErr.json().catch(() => ({}));
        if (data.message) return data.message;
        if (status === 409) return "That slot was just taken. Please pick another.";
        if (status >= 400 && status < 500) return "Some details look invalid. Please review and try again.";
        if (status >= 500) return "The server is having trouble. Please try again in a moment.";
        return "Something went wrong. Please try again.";
      };

      const MONTH_NAMES = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December",
      ];

      const pad      = (n) => String(n).padStart(2, "0");
      const fmtDate  = (d) => `${d.getUTCDate()} ${MONTH_NAMES[d.getUTCMonth()].slice(0,3)} ${d.getUTCFullYear()}`;
      const fmtDay   = (d) => `${MONTH_NAMES[d.getUTCMonth()].slice(0,3)} ${d.getUTCDate()}`;
      const fmtDow   = (d) => ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()];
      const ordinal  = (n) => {
        const v = n % 100;
        if (v >= 11 && v <= 13) return n + "th";
        switch (n % 10) {
          case 1: return n + "st";
          case 2: return n + "nd";
          case 3: return n + "rd";
          default: return n + "th";
        }
      };

      // ── Slug from URL path ────────────────────────────────────────────────────
      const getSlug = () => {
        const parts = window.location.pathname.split("/").filter(Boolean);
        const idx = parts.indexOf("book");
        return idx !== -1 && parts[idx + 1] ? parts[idx + 1] : null;
      };

      // ── Time slot helpers ─────────────────────────────────────────────────────
      const categoriseSlots = (slots) => ({
        Morning:   slots.filter((s) => parseInt(s) < 12),
        Afternoon: slots.filter((s) => parseInt(s) >= 12 && parseInt(s) < 17),
        Evening:   slots.filter((s) => parseInt(s) >= 17),
      });

      // ── Icons ─────────────────────────────────────────────────────────────────
      const IconMoon = () => (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      );

      const IconUtensils = () => (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
          <line x1="7" y1="2" x2="7" y2="22"/>
          <line x1="21" y1="15" x2="21" y2="22"/>
          <path d="M21 2a5 5 0 0 0 0 10"/>
        </svg>
      );

      const IconClock = () => (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      );

      const IconCalendar = () => (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8"  y1="2" x2="8"  y2="6"/>
          <line x1="3"  y1="10" x2="21" y2="10"/>
        </svg>
      );

      const IconCheck = () => (
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      );
      const IconCheckCircle = ({ color = "currentColor" }) => (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          style={{ flexShrink: 0 }}>
          <circle cx="12" cy="12" r="10"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      );
      const IconXCircle = ({ color = "currentColor" }) => (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          style={{ flexShrink: 0 }}>
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
      );

      const IconSearch = () => (
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"
          style={{ color: "var(--text-3)" }}>
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      );

      const IconArrowLeft = () => (
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      );

      const IconGraduationCap = () => (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      );


      // ── Calendar component ────────────────────────────────────────────────────
      const Calendar = ({ startDate, endDate, onChange, disablePast }) => {
        const today = utcMidnight(new Date());
        const seed  = startDate ?? today;
        const [month, setMonth] = useState(() => utcStartOfMonth(seed));

        const first  = utcStartOfMonth(month);
        const offset = (first.getUTCDay() + 6) % 7;
        const total  = utcDaysInMonth(month);
        const cells  = [
          ...Array(offset).fill(null),
          ...Array.from({ length: total }, (_, i) =>
            new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth(), i + 1))
          ),
        ];
        while (cells.length % 7 !== 0) cells.push(null);

        const handleDay = (day) => {
          if (!startDate || (startDate && endDate)) {
            onChange(day, null);
          } else if (utcBefore(day, startDate) || utcIsSameDay(day, startDate)) {
            onChange(day, null);
          } else {
            onChange(startDate, day);
          }
        };

        return (
          <div>
            <div className="cal-header">
              <button className="cal-nav" onClick={() => setMonth((m) => utcAddMonths(m, -1))}>‹</button>
              <span className="cal-month">
                {MONTH_NAMES[month.getUTCMonth()]} {month.getUTCFullYear()}
              </span>
              <button className="cal-nav" onClick={() => setMonth((m) => utcAddMonths(m, 1))}>›</button>
            </div>
            <div className="cal-grid">
              {WEEKDAYS.map((d) => <div key={d} className="cal-weekday">{d}</div>)}
              {cells.map((day, i) => {
                if (!day) return <div key={i} className="cal-cell" />;
                const isPast    = disablePast && utcMidnight(day) < today;
                const isStart   = startDate && utcIsSameDay(day, startDate);
                const isEnd     = endDate   && utcIsSameDay(day, endDate);
                const inRange   = startDate && endDate && utcAfter(day, startDate) && utcBefore(day, endDate);
                const isToday   = utcIsSameDay(day, today);
                let cls = "cal-day";
                if (isToday) cls += " today";
                let selStyle = {};
                if (isStart || isEnd || (isStart && isEnd)) {
                  selStyle = { background: "#16a34a", color: "#fff", fontWeight: 600 };
                } else if (inRange) {
                  selStyle = { background: "#bbf7d0", color: "#16a34a", fontWeight: 500 };
                }
                return (
                  <div key={i} className="cal-cell">
                    <button className={cls} style={selStyle} disabled={isPast} onClick={() => handleDay(day)}>
                      {day.getUTCDate()}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      // ── Contact form (shared) ─────────────────────────────────────────────────
      // Permissive email regex — matches the server-side validator.
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const isPhoneValid = (v) => {
        if (!v) return true; // phone is optional
        const digits = v.replace(/\D/g, "");
        return digits.length >= 6 && digits.length <= 20;
      };

      const ContactForm = ({ summary, onBack, onSubmit, loading, error }) => {
        const [name,        setName]        = useState("");
        const [email,       setEmail]       = useState("");
        const [phone,       setPhone]       = useState("");
        const [note,        setNote]        = useState("");
        const [localError,  setLocalError]  = useState("");

        const trimmedEmail = email.trim();
        const emailValid   = EMAIL_RE.test(trimmedEmail);
        const phoneValid   = isPhoneValid(phone.trim());
        const canSubmit    = !loading && name.trim() && emailValid && phoneValid;

        const handleSubmit = () => {
          if (!name.trim()) return setLocalError("Please enter your name.");
          if (!emailValid)  return setLocalError("Please enter a valid email address.");
          if (!phoneValid)  return setLocalError("Please enter a valid phone number.");
          setLocalError("");
          onSubmit({
            name: name.trim(),
            email: trimmedEmail,
            phone: phone.trim(),
            note: note.trim() || undefined,
          });
        };

        const messageError = localError || error;

        return (
          <div>
            <button className="back-btn" onClick={onBack}>
              <IconArrowLeft /> Back
            </button>
            <div className="card">
              <p className="section-label">Your details</p>
              <div className="summary">{summary}</div>
              <div className="form-field">
                <label className="form-label">Full name *</label>
                <input className="form-input" value={name} onChange={(e) => setName(e.target.value)}
                  placeholder="Jane Smith" maxLength={100} autoComplete="name" />
              </div>
              <div className="form-field">
                <label className="form-label">Email *</label>
                <input className="form-input" type="email" value={email} onChange={(e) => setEmail(e.target.value)}
                  placeholder="jane@example.com" maxLength={254} autoComplete="email" />
              </div>
              <div className="form-field">
                <label className="form-label">Phone</label>
                <input className="form-input" type="tel" value={phone} onChange={(e) => setPhone(e.target.value)}
                  placeholder="+44 7700 900000" maxLength={30} autoComplete="tel" />
              </div>
              <div className="form-field">
                <label className="form-label">Note for provider</label>
                <textarea
                  className="form-input"
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  placeholder="Allergies, accessibility, special requests…"
                  maxLength={1000}
                  rows={3}
                  style={{ resize: "vertical", minHeight: 72, fontFamily: "inherit" }}
                />
              </div>
              {messageError && (
                <p style={{ color: "var(--error)", fontSize: 13, marginBottom: 12 }}>{messageError}</p>
              )}
              <button className="btn btn-primary"
                disabled={!canSubmit}
                onClick={handleSubmit}>
                {loading ? "Sending…" : "Request Booking"}
              </button>
            </div>
          </div>
        );
      };

      // ── Room booking ──────────────────────────────────────────────────────────
      // ---------------------------------------------------------------------
      // Paying for a booking.
      //
      // The booking already exists and is holding its slot for fifteen minutes
      // with payment_status = 'pending'. It is NOT confirmed: no confirmation
      // email has been sent, and if this step is abandoned the server's sweep
      // releases the slot. What makes it real is Stripe telling the webservice
      // the money arrived.
      //
      // Card details are entered inside Stripe's own iframe and never touch
      // this page or At9's servers.
      //
      // `stripeAccount` is what makes this a **direct charge** on the
      // business's account — without it the payment would be attempted on the
      // platform account and fail.
      // ---------------------------------------------------------------------
      const money = (minor) =>
        new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP" })
          .format((minor || 0) / 100);

      // Sits between "booking created" and "show the confirmation". If the
      // server says money is due, the confirmation waits until it is paid;
      // otherwise nothing changes and the flow is exactly as it was.
      const usePaymentGate = (onDone) => {
        const [pending, setPending] = React.useState(null);
        return {
          pending,
          // Returns true when it has taken over the flow.
          handle: (data, doneArgs) => {
            const pay = data && data.payment;
            if (pay && pay.requiresPayment && pay.clientSecret) {
              setPending({ payment: pay, doneArgs });
              return true;
            }
            onDone(doneArgs);
            return false;
          },
          // Abandoning leaves the booking held until the server's sweep frees
          // it — no client-side cleanup to get wrong.
          cancel: () => setPending(null),
          complete: () => {
            const args = pending ? pending.doneArgs : {};
            setPending(null);
            onDone({ ...args, paid: true });
          },
        };
      };

      const PaymentStep = ({ payment, orgName, onPaid, onCancel }) => {
        const hostRef = React.useRef(null);
        const [stripe, setStripe] = React.useState(null);
        const [elements, setElements] = React.useState(null);
        const [ready, setReady] = React.useState(false);
        const [busy, setBusy] = React.useState(false);
        const [error, setError] = React.useState("");

        React.useEffect(() => {
          if (!payment?.clientSecret || !payment?.publishableKey) {
            setError("Payment isn't available right now. Please contact the business.");
            return;
          }
          if (typeof Stripe !== "function") {
            setError("Couldn't load the payment form. Please refresh and try again.");
            return;
          }
          const s = Stripe(payment.publishableKey, {
            stripeAccount: payment.stripeAccountId,
          });
          const e = s.elements({
            clientSecret: payment.clientSecret,
            appearance: { theme: "stripe", variables: { colorPrimary: "#554aca" } },
          });
          e.create("payment", { layout: "tabs" }).mount(hostRef.current);
          setStripe(s);
          setElements(e);
          setReady(true);
        }, [payment]);

        const pay = async () => {
          if (!stripe || !elements) return;
          setBusy(true);
          setError("");
          // `redirect: "if_required"` keeps the customer here for a normal card
          // and only leaves the page when the bank demands it (3-D Secure).
          const { error: stripeError, paymentIntent } = await stripe.confirmPayment({
            elements,
            redirect: "if_required",
          });
          setBusy(false);

          if (stripeError) {
            setError(stripeError.message || "Your payment couldn't be completed.");
            return;
          }
          // 'processing' covers slower methods (bank debits) — the booking is
          // confirmed by the webhook either way, so the customer is done.
          if (paymentIntent && ["succeeded", "processing"].includes(paymentIntent.status)) {
            onPaid();
            return;
          }
          setError("Your payment couldn't be completed. Please try another card.");
        };

        return (
          <div className="card">
            <p className="section-label">Payment</p>
            <div className="summary">
              {payment.summary || `Pay ${money(payment.amountDueNowMinor)} now.`}
              {" "}Your booking with {orgName} is held for 15 minutes while you pay.
            </div>

            <div ref={hostRef} style={{ marginBottom: 16, minHeight: 60 }} />

            {error && (
              <p style={{ color: "var(--error)", fontSize: 13, marginBottom: 12 }}>{error}</p>
            )}

            <button
              className="btn btn-primary"
              style={{ width: "100%" }}
              onClick={pay}
              disabled={!ready || busy}>
              {busy ? "Paying…" : `Pay ${money(payment.amountDueNowMinor)}`}
            </button>
            <button
              className="btn btn-ghost"
              style={{ width: "100%", marginTop: 8 }}
              onClick={onCancel}
              disabled={busy}>
              Cancel
            </button>

            <div style={{ marginTop: 12, fontSize: 12, color: "var(--text-2)", textAlign: "center" }}>
              Payments are processed securely by Stripe. {orgName} receives the money directly.
            </div>
          </div>
        );
      };

      const RoomBooking = ({ org, entities, onBack, onDone }) => {
        const gate = usePaymentGate(onDone);
        const [checkIn,  setCheckIn]  = useState(null);
        const [checkOut, setCheckOut] = useState(null);
        const [guests,   setGuests]   = useState(1);
        const [step,     setStep]     = useState("dates");
        const [loading,  setLoading]  = useState(false);
        const [error,    setError]    = useState("");
        const [availability,  setAvailability]  = useState(null);
        const [availChecking, setAvailChecking] = useState(false);

        const rooms  = entities.filter((e) => e.type === "room");
        const nights = checkIn && checkOut
          ? Math.round((utcMidnight(checkOut) - utcMidnight(checkIn)) / 86400000)
          : 0;
        const hasRange    = !!(checkIn && checkOut && nights > 0);
        const canContinue = hasRange && Array.isArray(availability) && availability.length > 0;

        const summary = canContinue
          ? `${fmtDate(checkIn)} — ${fmtDate(checkOut)} · ${nights} ${nights === 1 ? "night" : "nights"} · ${guests} ${guests === 1 ? "guest" : "guests"}`
          : "";

        useEffect(() => {
          if (!hasRange) { setAvailability(null); return; }
          let cancelled = false;
          setAvailChecking(true);
          setAvailability(null);
          const params = new URLSearchParams({
            startDate:    fmtIso(checkIn),
            endDate:      fmtIso(checkOut),
            minOccupancy: guests,
          });
          fetch(`${WS_URI}/rooms/public/availability/${org.id}?${params}`)
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(data => { if (!cancelled) setAvailability(Array.isArray(data) ? data.filter(e => !e.booked) : []); })
            .catch(() => { if (!cancelled) setAvailability([]); })
            .finally(() => { if (!cancelled) setAvailChecking(false); });
          return () => { cancelled = true; };
        }, [checkIn, checkOut, guests]);

        const handleSubmit = async ({ name, email, phone, note }) => {
          setLoading(true);
          setError("");
          try {
            // Use a room confirmed available, not just the first one defined.
            const firstAvailable = (availability ?? []).find(e => !e.booked);
            const res = await fetch(`${WS_URI}/bookings/public`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                organisationId: org.id,
                type: "room",
                entityId: firstAvailable?.id ?? rooms[0]?.id,
                startDate: fmtIso(checkIn),
                endDate:   fmtIso(checkOut),
                guests,
                customerName:  name,
                customerEmail: email,
                customerPhone: phone,
                customerNote:  note,
              }),
            });
            if (!res.ok) {
              setError(await friendlyError(res));
              return;
            }
            const data = await res.json().catch(() => ({}));
            gate.handle(data, { checkIn, checkOut, nights, guests, name, type: "room", reference: data?.reference });
          } catch (err) {
            setError(await friendlyError(err));
          } finally {
            setLoading(false);
          }
        };

        // Money is due: the booking exists and is holding its slot, but it
        // is not confirmed until Stripe says it has been paid.
        if (gate.pending) {
          return (
            <PaymentStep
              payment={gate.pending.payment}
              orgName={org.name}
              onPaid={gate.complete}
              onCancel={gate.cancel}
            />
          );
        }

        if (step === "contact") {
          return (
            <ContactForm
              summary={summary}
              onBack={() => setStep("dates")}
              onSubmit={handleSubmit}
              loading={loading}
              error={error}
            />
          );
        }

        return (
          <div>
            <button className="back-btn" onClick={onBack}>
              <IconArrowLeft /> Back
            </button>
            <div className="card">
              <p className="section-label">Select dates</p>
              <Calendar
                startDate={checkIn}
                endDate={checkOut}
                disablePast
                onChange={(s, e) => { setCheckIn(s); setCheckOut(e); }}
              />
              <div className="date-bar">
                <div className="date-bar-item">
                  <div className="date-bar-label">Check-in</div>
                  <div className={`date-bar-value${checkIn ? "" : " empty"}`}>
                    {checkIn ? fmtDay(checkIn) : "—"}
                  </div>
                </div>
                <div className="date-bar-mid">
                  {nights > 0 ? `${nights}n` : "·"}
                </div>
                <div className="date-bar-item" style={{ textAlign: "right" }}>
                  <div className="date-bar-label">Check-out</div>
                  <div className={`date-bar-value${checkOut ? "" : " empty"}`}>
                    {checkOut ? fmtDay(checkOut) : "—"}
                  </div>
                </div>
              </div>
            </div>
            <div className="card">
              <p className="section-label">Guests</p>
              <div className="guests-row">
                <span className="guests-label">Number of guests</span>
                <button className="guests-btn" disabled={guests <= 1} onClick={() => setGuests((g) => g - 1)}>−</button>
                <span className="guests-count">{guests}</span>
                <button className="guests-btn" onClick={() => setGuests((g) => g + 1)}>+</button>
              </div>
              {hasRange && (() => {
                const isAvailable = availability && availability.length > 0;
                // Pricing: cheapest nightly rate among non-booked rooms.
                const rates = (availability ?? [])
                  .filter(e => !e.booked && e.cost != null && e.cost !== "")
                  .map(e => Number(e.cost))
                  .filter(c => Number.isFinite(c));
                const nightly = rates.length ? Math.min(...rates) : null;
                const total = nightly != null && nights > 0 ? nightly * nights : null;
                const fmtGBP = (n) =>
                  `£${n.toLocaleString("en-GB", {
                    minimumFractionDigits: Number.isInteger(n) ? 0 : 2,
                    maximumFractionDigits: 2,
                  })}`;
                const priceLabel = nightly != null
                  ? (total != null
                      ? `from ${fmtGBP(nightly)}/night · ${fmtGBP(total)} total`
                      : `from ${fmtGBP(nightly)}/night`)
                  : null;
                return (
                  <div className={`avail-box ${availChecking ? "avail-checking" : isAvailable ? "avail-ok" : "avail-none"}`}>
                    {availChecking
                      ? <div className="avail-spinner" />
                      : isAvailable
                        ? <IconCheckCircle color="var(--success)" />
                        : <IconXCircle color="var(--error)" />
                    }
                    <div>
                      <div className="avail-main">
                        {availChecking
                          ? "Checking availability…"
                          : isAvailable
                            ? "Available"
                            : "No rooms available for these dates"
                        }
                      </div>
                      {!availChecking && isAvailable && (
                        <div className="avail-sub">
                          {nights} {nights === 1 ? "night" : "nights"} · {guests} {guests === 1 ? "guest" : "guests"}
                          {priceLabel ? ` · ${priceLabel}` : ""}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })()}
            </div>
            <button className="btn btn-primary" disabled={!canContinue} onClick={() => setStep("contact")}>
              Continue
            </button>
          </div>
        );
      };

      // ── Closed-day helpers ────────────────────────────────────────────────────
      const fmtIso = (d) =>
        `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;

      const isDayClosed = (d, openHours, overrides) => {
        const jsDay  = d.getUTCDay();
        const weekday = jsDay === 0 ? 7 : jsDay;
        const iso = fmtIso(d);
        if ((overrides ?? []).some(o => iso >= o.from.slice(0, 10) && iso <= o.to.slice(0, 10))) return true;
        return !(openHours ?? []).some(h => h.weekday === weekday);
      };

      // ── Table booking ─────────────────────────────────────────────────────────
      const TableBooking = ({ org, entities, preferences, onBack, onDone }) => {
        const gate = usePaymentGate(onDone);
        const today = utcMidnight(new Date());
        const todayMonthStart = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1));

        const [selectedMonth, setSelectedMonth] = useState(todayMonthStart);

        const dates = (() => {
          const isCurrentMonth = selectedMonth.getUTCFullYear() === today.getUTCFullYear() &&
                                 selectedMonth.getUTCMonth() === today.getUTCMonth();
          const startDay = isCurrentMonth ? today : selectedMonth;
          const monthEnd = new Date(Date.UTC(selectedMonth.getUTCFullYear(), selectedMonth.getUTCMonth() + 1, 0));
          const count = Math.round((monthEnd.getTime() - startDay.getTime()) / 86400000) + 1;
          return Array.from({ length: Math.max(count, 0) }, (_, i) =>
            new Date(startDay.getTime() + i * 86400000)
          );
        })();

        const openHours    = org.openHours ?? [];
        const overrides    = org.openHoursOverrides ?? [];

        // Find first open day to use as default selection
        const firstOpenDate = dates.find(d => !isDayClosed(d, openHours, overrides)) ?? dates[0];

        const [selectedDate,    setSelectedDate]    = useState(firstOpenDate);
        const [selectedTime,    setSelectedTime]    = useState(null);
        const [guests,          setGuests]          = useState(1);
        const [step,            setStep]            = useState("times");
        const [loading,         setLoading]         = useState(false);
        const [error,           setError]           = useState("");
        const [serverSlots,     setServerSlots]     = useState(null);
        const [slotDuration,    setSlotDuration]    = useState(90);
        const [loadingSlots,    setLoadingSlots]    = useState(false);

        const goToPrevMonth = () => {
          setSelectedMonth(prev => {
            const m = new Date(Date.UTC(prev.getUTCFullYear(), prev.getUTCMonth() - 1, 1));
            return m >= todayMonthStart ? m : todayMonthStart;
          });
          setSelectedTime(null);
        };

        const goToNextMonth = () => {
          setSelectedMonth(prev =>
            new Date(Date.UTC(prev.getUTCFullYear(), prev.getUTCMonth() + 1, 1))
          );
          setSelectedTime(null);
        };

        // When month changes, select first open day of the new window
        const prevMonthRef = React.useRef(selectedMonth);
        if (prevMonthRef.current !== selectedMonth) {
          prevMonthRef.current = selectedMonth;
          const newFirst = dates.find(d => !isDayClosed(d, openHours, overrides)) ?? dates[0];
          if (newFirst) setSelectedDate(newFirst);
        }

        const isPrevDisabled = selectedMonth.getUTCFullYear() === todayMonthStart.getUTCFullYear() &&
                               selectedMonth.getUTCMonth() === todayMonthStart.getUTCMonth();

        const dateStripRef = React.useRef(null);
        const scrollStrip = (dir) => {
          if (dateStripRef.current) {
            dateStripRef.current.scrollBy({ left: dir * dateStripRef.current.clientWidth, behavior: 'smooth' });
          }
        };

        const tables  = entities.filter((e) => e.type === "table");
        const slots   = serverSlots ?? [];
        const grouped = categoriseSlots(slots.map(s => s.time));

        useEffect(() => {
          if (isDayClosed(selectedDate, openHours, overrides)) {
            setServerSlots([]);
            setSelectedTime(null);
            return;
          }
          let cancelled = false;
          setLoadingSlots(true);
          setSelectedTime(null);
          const dateStr = `${selectedDate.getUTCFullYear()}-${pad(selectedDate.getUTCMonth()+1)}-${pad(selectedDate.getUTCDate())}`;
          fetch(`${WS_URI}/tables/public/availability/${org.id}?date=${dateStr}&guests=${guests}`)
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(data => {
              if (!cancelled) {
                setServerSlots(data.slots ?? []);
                setSlotDuration(data.duration ?? 90);
              }
            })
            .catch(() => { if (!cancelled) setServerSlots([]); })
            .finally(() => { if (!cancelled) setLoadingSlots(false); });
          return () => { cancelled = true; };
        }, [selectedDate, guests]);

        const summary = `${fmtDow(selectedDate)} ${selectedDate.getUTCDate()} ${MONTH_NAMES[selectedDate.getUTCMonth()].slice(0,3)} · ${selectedTime}`;

        const buildDatetime = (date, timeStr) => {
          const [h, m] = timeStr.split(":").map(Number);
          return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(), h, m));
        };

        const handleSubmit = async ({ name, email, phone, note }) => {
          setLoading(true);
          setError("");
          const intervalMin = Math.max(15, slotDuration);
          const start = buildDatetime(selectedDate, selectedTime);
          const end   = new Date(start.getTime() + intervalMin * 60000);
          try {
            const res = await fetch(`${WS_URI}/bookings/public`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                organisationId: org.id,
                type:           "table",
                startDate:      start.toISOString(),
                endDate:        end.toISOString(),
                guests,
                customerName:   name,
                customerEmail:  email,
                customerPhone:  phone,
                customerNote:   note,
              }),
            });
            if (!res.ok) {
              setError(await friendlyError(res));
              return;
            }
            const data = await res.json().catch(() => ({}));
            gate.handle(data, { date: selectedDate, time: selectedTime, name, type: "table", reference: data?.reference });
          } catch (err) {
            setError(await friendlyError(err));
          } finally {
            setLoading(false);
          }
        };

        // Money is due: the booking exists and is holding its slot, but it
        // is not confirmed until Stripe says it has been paid.
        if (gate.pending) {
          return (
            <PaymentStep
              payment={gate.pending.payment}
              orgName={org.name}
              onPaid={gate.complete}
              onCancel={gate.cancel}
            />
          );
        }

        if (step === "contact") {
          return (
            <ContactForm
              summary={summary}
              onBack={() => setStep("times")}
              onSubmit={handleSubmit}
              loading={loading}
              error={error}
            />
          );
        }

        return (
          <div>
            <button className="back-btn" onClick={onBack}>
              <IconArrowLeft /> Back
            </button>
            <div className="card">
              <p className="section-label">Pick a date</p>
              <div className="date-strip-hdr">
                <button
                  className="strip-nav-btn"
                  disabled={isPrevDisabled}
                  onClick={goToPrevMonth}>
                  &#8249;
                </button>
                <span className="date-strip-hdr-label">
                  {MONTH_NAMES[selectedMonth.getUTCMonth()]} {selectedMonth.getUTCFullYear()}
                </span>
                <button className="strip-nav-btn" onClick={goToNextMonth}>
                  &#8250;
                </button>
              </div>
              <div className="date-strip-wrap">
                <button
                  className="strip-side-btn"
                  onClick={() => scrollStrip(-1)}>
                  &#8249;
                </button>
                <div className="date-strip" ref={dateStripRef}>
                  {dates.map((d, i) => {
                    const sel    = utcIsSameDay(d, selectedDate);
                    const closed = isDayClosed(d, openHours, overrides);
                    return (
                      <div key={i}
                        className={`date-chip${sel ? " selected" : ""}${closed ? " closed" : ""}`}
                        onClick={() => { if (!closed) { setSelectedDate(d); setSelectedTime(null); } }}
                        style={closed ? { opacity: 0.35, cursor: "default" } : undefined}>
                        <div className="date-chip-day">{fmtDow(d)}</div>
                        <div className="date-chip-num">{d.getUTCDate()}</div>
                      </div>
                    );
                  })}
                </div>
                <button className="strip-side-btn" onClick={() => scrollStrip(1)}>
                  &#8250;
                </button>
              </div>
            </div>
            <div className="card">
              <p className="section-label">Pick a time</p>
              {loadingSlots && (
                <p style={{ color: "var(--text-3)", fontSize: 14 }}>Checking availability…</p>
              )}
              {!loadingSlots && Object.entries(grouped).map(([period, periodSlots]) =>
                periodSlots.length > 0 ? (
                  <div key={period} style={{ marginBottom: 16 }}>
                    <p className="slot-period">{period}</p>
                    <div className="slot-grid">
                      {periodSlots.map((slotTime) => {
                        const slotData = slots.find(s => s.time === slotTime);
                        const isAvailable = slotData ? slotData.available : true;
                        const isSelected = selectedTime === slotTime;
                        return (
                          <button key={slotTime}
                            className={`slot${isSelected ? " selected" : ""}`}
                            disabled={!isAvailable}
                            style={{ opacity: isAvailable ? 1 : 0.35, cursor: isAvailable ? "pointer" : "default" }}
                            onClick={() => isAvailable && setSelectedTime(slotTime)}>
                            {slotTime}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                ) : null
              )}
              {!loadingSlots && slots.length === 0 && (
                <p style={{ color: "var(--text-3)", fontSize: 14 }}>No available times.</p>
              )}
            </div>
            <div className="card">
              <p className="section-label">Number of guests</p>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <button
                  style={{ width: 36, height: 36, borderRadius: "50%", border: "1px solid var(--border)",
                    background: "var(--surface)", fontSize: 20, cursor: "pointer",
                    display: "flex", alignItems: "center", justifyContent: "center" }}
                  disabled={guests <= 1}
                  onClick={() => setGuests(g => Math.max(1, g - 1))}>−</button>
                <span style={{ fontSize: 18, minWidth: 24, textAlign: "center" }}>{guests}</span>
                <button
                  style={{ width: 36, height: 36, borderRadius: "50%", border: "1px solid var(--border)",
                    background: "var(--surface)", fontSize: 20, cursor: "pointer",
                    display: "flex", alignItems: "center", justifyContent: "center" }}
                  onClick={() => setGuests(g => g + 1)}>+</button>
              </div>
            </div>
            <button className="btn btn-primary" disabled={!selectedTime || guests < 1}
              onClick={() => setStep("contact")}>
              Continue
            </button>
          </div>
        );
      };

      // ── Appointment booking ───────────────────────────────────────────────────
      const AppointmentBooking = ({ org, services, onBack, onDone }) => {
        const gate = usePaymentGate(onDone);
        const today = utcMidnight(new Date());
        const todayMonthStart = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1));
        const openHours  = org.openHours ?? [];
        const overrides  = org.openHoursOverrides ?? [];

        const [selectedService,  setSelectedService]  = useState(services.length === 1 ? services[0] : null);
        const [selectedMonth,    setSelectedMonth]    = useState(todayMonthStart);
        const [selectedDate,     setSelectedDate]     = useState(today);
        const [selectedTime,     setSelectedTime]     = useState(null);
        const [slots,            setSlots]            = useState([]);
        const [loadingSlots,     setLoadingSlots]     = useState(false);
        const [step,             setStep]             = useState(services.length === 1 ? "times" : "service");
        const [loading,          setLoading]          = useState(false);
        const [error,            setError]            = useState("");

        const dates = (() => {
          const isCurrentMonth = selectedMonth.getUTCFullYear() === today.getUTCFullYear() &&
                                 selectedMonth.getUTCMonth() === today.getUTCMonth();
          const startDay = isCurrentMonth ? today : selectedMonth;
          const monthEnd = new Date(Date.UTC(selectedMonth.getUTCFullYear(), selectedMonth.getUTCMonth() + 1, 0));
          const count = Math.round((monthEnd.getTime() - startDay.getTime()) / 86400000) + 1;
          return Array.from({ length: Math.max(count, 0) }, (_, i) =>
            new Date(startDay.getTime() + i * 86400000)
          );
        })();

        const isPrevDisabled = selectedMonth.getUTCFullYear() === todayMonthStart.getUTCFullYear() &&
                               selectedMonth.getUTCMonth() === todayMonthStart.getUTCMonth();
        const dateStripRef = React.useRef(null);
        const scrollStrip = (dir) => {
          if (dateStripRef.current) dateStripRef.current.scrollBy({ left: dir * dateStripRef.current.clientWidth, behavior: 'smooth' });
        };

        useEffect(() => {
          if (!selectedService || !selectedDate) return;
          if (isDayClosed(selectedDate, openHours, overrides)) { setSlots([]); setSelectedTime(null); return; }
          let cancelled = false;
          setLoadingSlots(true);
          setSelectedTime(null);
          const dateStr = fmtIso(selectedDate);
          fetch(`${WS_URI}/services/public/${selectedService.id}/availability?date=${dateStr}`)
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(data => { if (!cancelled) setSlots(data.slots ?? []); })
            .catch(() => { if (!cancelled) setSlots([]); })
            .finally(() => { if (!cancelled) setLoadingSlots(false); });
          return () => { cancelled = true; };
        }, [selectedService, selectedDate]);

        const grouped = (() => {
          const out = { Morning: [], Afternoon: [], Evening: [] };
          (slots ?? []).forEach(s => {
            const h = parseInt(s.time);
            if (h < 12) out.Morning.push(s);
            else if (h < 17) out.Afternoon.push(s);
            else out.Evening.push(s);
          });
          return out;
        })();

        const handleSubmit = async ({ name, email, phone, note }) => {
          setLoading(true);
          setError("");
          try {
            const res = await fetch(`${WS_URI}/appointments/public`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                organisationId: org.id,
                type:           "service",
                serviceId:      selectedService.id,
                date:           fmtIso(selectedDate),
                time:           selectedTime,
                customerName:   name,
                customerEmail:  email,
                customerPhone:  phone,
                customerNote:   note,
              }),
            });
            if (!res.ok) {
              setError(await friendlyError(res));
              return;
            }
            const data = await res.json().catch(() => ({}));
            gate.handle(data, { date: selectedDate, time: selectedTime, name, service: selectedService.title, type: "appointment", reference: data?.reference });
          } catch (err) {
            setError(await friendlyError(err));
          } finally {
            setLoading(false);
          }
        };

        const summary = selectedService && selectedTime
          ? `${selectedService.title} · ${fmtDow(selectedDate)} ${selectedDate.getUTCDate()} ${MONTH_NAMES[selectedDate.getUTCMonth()].slice(0,3)} · ${selectedTime}`
          : "";

        // Money is due: the booking exists and is holding its slot, but it
        // is not confirmed until Stripe says it has been paid.
        if (gate.pending) {
          return (
            <PaymentStep
              payment={gate.pending.payment}
              orgName={org.name}
              onPaid={gate.complete}
              onCancel={gate.cancel}
            />
          );
        }

        if (step === "contact") {
          return (
            <ContactForm
              summary={summary}
              onBack={() => setStep("times")}
              onSubmit={handleSubmit}
              loading={loading}
              error={error}
            />
          );
        }

        return (
          <div>
            <button className="back-btn" onClick={onBack}><IconArrowLeft /> Back</button>

            {/* Service selector (skip if only one service) */}
            {services.length > 1 && (
              <div className="card">
                <p className="section-label">Select a service</p>
                {services.map(s => (
                  <div key={s.id}
                    onClick={() => { setSelectedService(s); setStep("times"); setSlots([]); setSelectedTime(null); }}
                    style={{
                      display: "flex", alignItems: "center", justifyContent: "space-between",
                      padding: "12px 0", borderBottom: "1px solid var(--border)", cursor: "pointer",
                    }}>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 600 }}>{s.title}</div>
                      {s.description && <div style={{ fontSize: 12, color: "var(--text-2)", marginTop: 2 }}>{s.description}</div>}
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 12 }}>
                      {s.duration != null && <div style={{ fontSize: 12, color: "var(--text-2)" }}>{s.duration} min</div>}
                      {s.cost != null && <div style={{ fontSize: 12, color: "var(--text-2)" }}>£{Number(s.cost).toFixed(2)}</div>}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {step !== "service" && selectedService && (
              <>
                {services.length > 1 && (
                  <div style={{ marginBottom: 12, padding: "10px 14px", background: "var(--accent-bg)",
                    borderRadius: "var(--r-sm)", border: "1px solid var(--accent-mid)",
                    fontSize: 13, fontWeight: 600 }}>
                    {selectedService.title}
                    {selectedService.duration != null && <span style={{ fontWeight: 400, color: "var(--text-2)", marginLeft: 8 }}>{selectedService.duration} min</span>}
                    {selectedService.cost != null && <span style={{ fontWeight: 400, color: "var(--text-2)", marginLeft: 8 }}>£{Number(selectedService.cost).toFixed(2)}</span>}
                  </div>
                )}

                <div className="card">
                  <p className="section-label">Pick a date</p>
                  <div className="date-strip-hdr">
                    <button className="strip-nav-btn" disabled={isPrevDisabled}
                      onClick={() => {
                        setSelectedMonth(prev => new Date(Date.UTC(prev.getUTCFullYear(), prev.getUTCMonth() - 1, 1)));
                        setSelectedTime(null);
                      }}>&#8249;</button>
                    <span className="date-strip-hdr-label">
                      {MONTH_NAMES[selectedMonth.getUTCMonth()]} {selectedMonth.getUTCFullYear()}
                    </span>
                    <button className="strip-nav-btn"
                      onClick={() => {
                        setSelectedMonth(prev => new Date(Date.UTC(prev.getUTCFullYear(), prev.getUTCMonth() + 1, 1)));
                        setSelectedTime(null);
                      }}>&#8250;</button>
                  </div>
                  <div className="date-strip-wrap">
                    <button className="strip-side-btn" onClick={() => scrollStrip(-1)}>&#8249;</button>
                    <div className="date-strip" ref={dateStripRef}>
                      {dates.map((d, i) => {
                        const sel    = utcIsSameDay(d, selectedDate);
                        const closed = isDayClosed(d, openHours, overrides);
                        return (
                          <div key={i}
                            className={`date-chip${sel ? " selected" : ""}`}
                            onClick={() => { if (!closed) { setSelectedDate(d); setSelectedTime(null); } }}
                            style={closed ? { opacity: 0.35, cursor: "default" } : undefined}>
                            <div className="date-chip-day">{fmtDow(d)}</div>
                            <div className="date-chip-num">{d.getUTCDate()}</div>
                          </div>
                        );
                      })}
                    </div>
                    <button className="strip-side-btn" onClick={() => scrollStrip(1)}>&#8250;</button>
                  </div>
                </div>

                <div className="card">
                  <p className="section-label">Pick a time</p>
                  {loadingSlots && <p style={{ color: "var(--text-3)", fontSize: 14 }}>Checking availability…</p>}
                  {!loadingSlots && Object.entries(grouped).map(([period, periodSlots]) =>
                    periodSlots.length > 0 ? (
                      <div key={period} style={{ marginBottom: 16 }}>
                        <p className="slot-period">{period}</p>
                        <div className="slot-grid">
                          {periodSlots.map((s) => (
                            <button key={s.time}
                              className={`slot${selectedTime === s.time ? " selected" : ""}`}
                              disabled={!s.available}
                              style={{ opacity: s.available ? 1 : 0.35, cursor: s.available ? "pointer" : "default" }}
                              onClick={() => s.available && setSelectedTime(s.time)}>
                              {s.time}
                            </button>
                          ))}
                        </div>
                      </div>
                    ) : null
                  )}
                  {!loadingSlots && slots.length === 0 && (
                    <p style={{ color: "var(--text-3)", fontSize: 14 }}>No available times for this date.</p>
                  )}
                </div>

                <button className="btn btn-primary" disabled={!selectedTime}
                  onClick={() => setStep("contact")}>
                  Continue
                </button>
              </>
            )}
          </div>
        );
      };

      // ── Event booking ─────────────────────────────────────────────────────────
      const EventBooking = ({ org, events, onBack, onDone }) => {
        const gate = usePaymentGate(onDone);
        const [selectedEvent, setSelectedEvent] = useState(null);
        // Per-event selected days for multi-day events (multi-select).
        const [eventDays, setEventDays] = useState({});
        // Per-event picked ticket type id. Empty when an event has no
        // ticket types configured.
        const [eventTicketType, setEventTicketType] = useState({});
        // Carries whether the contact form is finishing a booking or a
        // waitlist join — set when the user taps Select/Join on the
        // event card.
        const [waitlistMode, setWaitlistMode] = useState(false);
        const [step,          setStep]          = useState("list");
        const [loading,       setLoading]       = useState(false);
        const [error,         setError]         = useState("");

        const enumDates = (start, end) => {
          if (!start || !end || start > end) return [];
          const out = [];
          let d = new Date(start + "T00:00:00Z");
          const last = new Date(end + "T00:00:00Z").getTime();
          while (d.getTime() <= last) {
            out.push(d.toISOString().slice(0, 10));
            d = new Date(d.getTime() + 86400000);
          }
          return out;
        };
        const fmtDayChip = (iso) => {
          const dt = new Date(iso + "T00:00:00Z");
          const dow = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getUTCDay()];
          return { dow, day: dt.getUTCDate() };
        };
        const toggleDay = (evtId, iso) => {
          setEventDays(prev => {
            const cur = prev[evtId] ?? [];
            const next = cur.includes(iso) ? cur.filter(d => d !== iso) : [...cur, iso];
            return { ...prev, [evtId]: next };
          });
        };

        const handleSelectEvent = (evt, mode = "book") => {
          setSelectedEvent(evt);
          setWaitlistMode(mode === "waitlist");
          setStep("contact");
        };

        const isSelectedMultiDay = !!(
          selectedEvent?.end_date &&
          selectedEvent.end_date > selectedEvent.start_date
        );
        const selectedDays = selectedEvent ? (eventDays[selectedEvent.id] ?? []) : [];

        const handleSubmit = async ({ name, email, phone, note }) => {
          setLoading(true);
          setError("");
          try {
            const hasTicketTypes = (selectedEvent?.ticket_types?.length ?? 0) > 0;
            const pickedTicketType = selectedEvent ? eventTicketType[selectedEvent.id] : null;
            if (waitlistMode) {
              // Waitlist endpoint takes one date per call — fire sequentially
              // for multi-day so we surface the first failure as the error.
              const dates = isSelectedMultiDay
                ? (selectedDays.length ? selectedDays : [undefined])
                : [undefined];
              for (const day of dates) {
                const res = await fetch(`${WS_URI}/events/waitlist/public`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    eventId:        selectedEvent.id,
                    organisationId: org.id,
                    type:           "event",
                    customerName:   name,
                    customerEmail:  email,
                    customerPhone:  phone,
                    customerNote:   note,
                    bookingDate:    day,
                  }),
                });
                if (!res.ok) {
                  setError(await friendlyError(res));
                  return;
                }
              }
              const firstDate = isSelectedMultiDay ? selectedDays[0] : selectedEvent.start_date;
              const dateObj = firstDate ? new Date(firstDate + "T00:00:00Z") : null;
              onDone({ type: "event-waitlist", name, event: selectedEvent.title, date: dateObj, time: selectedEvent.start_time });
              return;
            }
            const res = await fetch(`${WS_URI}/events/bookings/public`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                eventId:        selectedEvent.id,
                organisationId: org.id,
                type:           "event",
                customerName:   name,
                customerEmail:  email,
                customerPhone:  phone,
                customerNote:   note,
                bookingDates:   isSelectedMultiDay ? selectedDays : undefined,
                // Same tier for every picked day in v1.
                ticketTypeIds:  hasTicketTypes
                  ? (isSelectedMultiDay ? selectedDays : [null]).map(() => pickedTicketType)
                  : undefined,
              }),
            });
            if (!res.ok) {
              setError(await friendlyError(res));
              return;
            }
            const data = await res.json().catch(() => ({}));
            const firstDate = isSelectedMultiDay ? selectedDays[0] : selectedEvent.start_date;
            const dateObj = firstDate ? new Date(firstDate + "T00:00:00Z") : null;
            gate.handle(data, {
              type: "event",
              name,
              event: selectedEvent.title,
              date: dateObj,
              time: selectedEvent.start_time,
              // For multi-day events the backend returns one reference per
              // day in `references`; we surface the first to keep the
              // confirmation card succinct.
              reference: data?.reference ?? data?.references?.[0],
            });
          } catch (err) {
            setError(await friendlyError(err));
          } finally {
            setLoading(false);
          }
        };

        const summary = selectedEvent
          ? selectedEvent.title +
            (isSelectedMultiDay && selectedDays.length > 0
              ? ` · ${selectedDays.join(", ")}`
              : selectedEvent.start_date
              ? ` · ${selectedEvent.start_date}${selectedEvent.end_date ? ` – ${selectedEvent.end_date}` : ""}`
              : "") +
            (selectedEvent.start_time ? ` · ${selectedEvent.start_time}` : "")
          : "";

        // Money is due: the booking exists and is holding its slot, but it
        // is not confirmed until Stripe says it has been paid.
        if (gate.pending) {
          return (
            <PaymentStep
              payment={gate.pending.payment}
              orgName={org.name}
              onPaid={gate.complete}
              onCancel={gate.cancel}
            />
          );
        }

        if (step === "contact") {
          return (
            <ContactForm
              summary={summary}
              onBack={() => setStep("list")}
              onSubmit={handleSubmit}
              loading={loading}
              error={error}
            />
          );
        }

        return (
          <div>
            <button className="back-btn" onClick={onBack}><IconArrowLeft /> Back</button>
            {events.map(evt => {
              const isMultiDay = !!(evt.end_date && evt.end_date > evt.start_date);
              const pickedDays = eventDays[evt.id] ?? [];
              const isFull = !isMultiDay && evt.capacity != null && evt.booking_count >= evt.capacity;
              const dateLabel = evt.end_date
                ? `${evt.start_date} – ${evt.end_date}`
                : evt.start_date ?? "";
              const timeLabel = [evt.start_time, evt.end_time].filter(Boolean).join("–");
              const days = isMultiDay ? enumDates(evt.start_date, evt.end_date) : [];
              // Multi-day: count picked days that are at capacity; when
              // they're all full the Select button flips to "Join waitlist".
              const pickedFullCount = isMultiDay
                ? pickedDays.filter(d => {
                    const c = evt.bookings_by_date?.[d] ?? 0;
                    return evt.capacity != null && c >= evt.capacity;
                  }).length
                : 0;
              const allPickedFull =
                isMultiDay && pickedDays.length > 0 && pickedFullCount === pickedDays.length;
              const cardWaitlistMode = isFull || allPickedFull;
              const hasTypes = (evt.ticket_types?.length ?? 0) > 0;
              const hasTypePicked = !hasTypes || !!eventTicketType[evt.id];
              const canSelect =
                (!isMultiDay || pickedDays.length > 0) && hasTypePicked;
              return (
                <div key={evt.id} className="card" style={{ marginBottom: 10 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>{evt.title}</div>
                  {evt.description && (
                    <div style={{ fontSize: 13, color: "var(--text-2)", marginBottom: 6 }}>{evt.description}</div>
                  )}
                  {(dateLabel || timeLabel) && (
                    <div style={{ fontSize: 13, color: "var(--text-2)", marginBottom: 4 }}>
                      {[dateLabel, timeLabel].filter(Boolean).join(" · ")}
                    </div>
                  )}
                  {(evt.ticket_types?.length ?? 0) > 0 && (
                    <div style={{ marginTop: 6, marginBottom: 8 }}>
                      <div style={{ fontSize: 12, color: "var(--text-2)", marginBottom: 4 }}>
                        Ticket type
                      </div>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                        {(evt.ticket_types ?? []).map(t => {
                          const isSelected = eventTicketType[evt.id] === t.id;
                          const sold = (evt.ticket_bookings ?? [])
