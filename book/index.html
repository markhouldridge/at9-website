                            .filter(tb => tb.ticket_type_id === t.id)
                            .reduce((a, tb) => a + tb.count, 0);
                          const typeFull = t.capacity != null && sold >= t.capacity;
                          return (
                            <button
                              key={t.id}
                              type="button"
                              onClick={() =>
                                setEventTicketType(prev => ({ ...prev, [evt.id]: t.id }))
                              }
                              style={{
                                padding: "4px 10px",
                                borderRadius: 6,
                                border: `1px solid ${isSelected ? "var(--accent)" : "var(--border)"}`,
                                background: isSelected ? "var(--accent-bg)" : "var(--surface)",
                                color: isSelected ? "var(--accent)" : "var(--text)",
                                cursor: "pointer",
                                fontSize: 13,
                                textAlign: "left",
                                lineHeight: 1.2,
                              }}>
                              <div>{t.title}{t.cost != null ? ` · £${Number(t.cost).toFixed(2)}` : ""}</div>
                              {typeFull && (
                                <div style={{ fontSize: 10, color: "var(--error)" }}>Sold out</div>
                              )}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                  {isMultiDay && (
                    <div style={{ marginTop: 6, marginBottom: 8 }}>
                      <div style={{ fontSize: 12, color: "var(--text-2)", marginBottom: 4 }}>
                        Pick days
                      </div>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                        {days.map(iso => {
                          const chip = fmtDayChip(iso);
                          const isSelected = pickedDays.includes(iso);
                          const dayBooked = evt.bookings_by_date?.[iso] ?? 0;
                          const dayFull = evt.capacity != null && dayBooked >= evt.capacity;
                          return (
                            <button
                              key={iso}
                              type="button"
                              onClick={() => toggleDay(evt.id, iso)}
                              style={{
                                minWidth: 48,
                                padding: "4px 10px",
                                borderRadius: 6,
                                border: `1px solid ${isSelected ? "var(--accent)" : "var(--border)"}`,
                                background: isSelected ? "var(--accent-bg)" : "var(--surface)",
                                color: isSelected ? "var(--accent)" : "var(--text)",
                                cursor: "pointer",
                                fontSize: 13,
                                textAlign: "center",
                                lineHeight: 1.2,
                              }}>
                              <div style={{ fontSize: 11, color: "var(--text-2)" }}>{chip.dow}</div>
                              <div style={{ fontWeight: 600 }}>{chip.day}</div>
                              {dayFull && (
                                <div style={{ fontSize: 10, color: "var(--error)" }}>Full</div>
                              )}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                  {evt.cost != null && (evt.ticket_types?.length ?? 0) === 0 && (
                    <div style={{ fontSize: 13, color: "var(--text-2)", marginBottom: 4 }}>
                      £{Number(evt.cost).toFixed(2)}
                    </div>
                  )}
                  {!isMultiDay && evt.capacity != null && (
                    <div style={{ fontSize: 12, color: isFull ? "var(--error)" : "var(--text-2)", marginBottom: 8 }}>
                      {isFull
                        ? "Fully booked"
                        : `${evt.capacity - evt.booking_count} place${evt.capacity - evt.booking_count !== 1 ? "s" : ""} remaining`}
                    </div>
                  )}
                  <button
                    className="btn btn-primary"
                    disabled={!canSelect}
                    style={{ opacity: !canSelect ? 0.4 : 1, cursor: !canSelect ? "default" : "pointer" }}
                    onClick={() =>
                      canSelect &&
                      handleSelectEvent(evt, cardWaitlistMode ? "waitlist" : "book")
                    }>
                    {isMultiDay && pickedDays.length === 0
                      ? "Pick a day"
                      : cardWaitlistMode
                      ? isMultiDay && pickedDays.length > 1
                        ? `Join waitlist (${pickedDays.length} days)`
                        : "Join waitlist"
                      : isMultiDay && pickedDays.length > 1
                      ? `Select (${pickedDays.length} days)`
                      : "Select"}
                  </button>
                </div>
              );
            })}
          </div>
        );
      };

      // ── Class booking ─────────────────────────────────────────────────────────
      const WEEKDAY_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

      const ClassBooking = ({ org, classes, onBack, onDone }) => {
        const gate = usePaymentGate(onDone);
        const [selectedClass, setSelectedClass] = useState(null);
        const [selectedDate,  setSelectedDate]  = useState(null);
        const [classDay,      setClassDay]      = useState({}); // { [classId]: occurrenceDate }
        const [step,          setStep]          = useState("list"); // 'list' | 'contact'
        const [loading,       setLoading]       = useState(false);
        const [error,         setError]         = useState("");

        const fmtChip = (iso) => {
          const dt = new Date(iso + "T00:00:00Z");
          const dow = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getUTCDay()];
          return { dow, day: dt.getUTCDate() };
        };

        // Next 8 dates on or after today that fall on one of the class's
        // weekdays, inside the class window, and aren't cancelled.
        const upcomingDates = (cls, limit = 8) => {
          const weekdays = Array.isArray(cls?.weekdays) ? cls.weekdays : [];
          if (weekdays.length === 0) return [];
          const today = new Date();
          const todayMs = Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate());
          const startMs = cls.start_date ? new Date(cls.start_date + "T00:00:00Z").getTime() : 0;
          const fromMs = Math.max(todayMs, startMs);
          const toMs = cls.end_date ? new Date(cls.end_date + "T00:00:00Z").getTime() : Infinity;
          const skip = new Set(cls.cancellations ?? []);
          const out = [];
          const cursor = new Date(fromMs);
          while (out.length < limit && cursor.getTime() <= toMs) {
            if (weekdays.includes(cursor.getUTCDay())) {
              const iso = cursor.toISOString().slice(0, 10);
              if (!skip.has(iso)) out.push(iso);
            }
            cursor.setUTCDate(cursor.getUTCDate() + 1);
          }
          return out;
        };

        const handleSelectClass = (cls, occurrenceDate) => {
          setSelectedClass(cls);
          setSelectedDate(occurrenceDate);
          setStep("contact");
        };

        const handleSubmit = async ({ name, email, phone, note }) => {
          setLoading(true);
          setError("");
          try {
            const res = await fetch(`${WS_URI}/classes/bookings/public`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                classId:        selectedClass.id,
                organisationId: org.id,
                type:           "class",
                occurrenceDate: selectedDate,
                customerName:   name,
                customerEmail:  email,
                customerPhone:  phone,
                customerNote:   note,
              }),
            });
            if (!res.ok) {
              setError(await friendlyError(res));
              return;
            }
            const data = await res.json().catch(() => ({}));
            const timeLabel = [selectedClass.start_time, selectedClass.end_time].filter(Boolean).join("–");
            const dateLabel = selectedDate
              ? new Date(selectedDate + "T00:00:00Z").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })
              : "";
            const schedule = [dateLabel, timeLabel].filter(Boolean).join(" · ");
            gate.handle(data, { type: "class", name, cls: selectedClass.title, schedule, reference: data?.reference });
          } catch (err) {
            setError(await friendlyError(err));
          } finally {
            setLoading(false);
          }
        };

        const summary = selectedClass
          ? (() => {
              const timeLabel = [selectedClass.start_time, selectedClass.end_time].filter(Boolean).join("–");
              const dateLabel = selectedDate
                ? new Date(selectedDate + "T00:00:00Z").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })
                : "";
              return `${selectedClass.title}${dateLabel ? ` · ${dateLabel}` : ""}${timeLabel ? ` · ${timeLabel}` : ""}`;
            })()
          : "";

        // Money is due: the booking exists and is holding its slot, but it
        // is not confirmed until Stripe says it has been paid.
        if (gate.pending) {
          return (
            <PaymentStep
              payment={gate.pending.payment}
              orgName={org.name}
              onPaid={gate.complete}
              onCancel={gate.cancel}
            />
          );
        }

        if (step === "contact") {
          return (
            <ContactForm
              summary={summary}
              onBack={() => setStep("list")}
              onSubmit={handleSubmit}
              loading={loading}
              error={error}
            />
          );
        }

        return (
          <div>
            <button className="back-btn" onClick={onBack}><IconArrowLeft /> Back</button>
            {classes.map(cls => {
              const occurrences = upcomingDates(cls);
              const pickedDay = classDay[cls.id] ?? null;
              const pickedBooked = pickedDay ? (cls.bookings_by_date?.[pickedDay] ?? 0) : 0;
              const spotsLeft = cls.capacity != null && pickedDay
                ? cls.capacity - pickedBooked
                : null;
              const isFull = spotsLeft != null && spotsLeft <= 0 && !!pickedDay;
              const timeLabel = [cls.start_time, cls.end_time].filter(Boolean).join("–");
              const weekdayLabel = (cls.weekdays ?? [])
                .slice()
                .sort((a, b) => a - b)
                .map(w => WEEKDAY_FULL[w])
                .filter(Boolean)
                .join(", ");
              return (
                <div key={cls.id} className="card" style={{ marginBottom: 10 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>{cls.title}</div>
                  {cls.description && (
                    <div style={{ fontSize: 13, color: "var(--text-2)", marginBottom: 6 }}>{cls.description}</div>
                  )}
                  <div style={{ fontSize: 13, color: "var(--text-2)", marginBottom: 4 }}>
                    Every {weekdayLabel}{timeLabel ? ` · ${timeLabel}` : ""}
                  </div>
                  {cls.cost != null && (
                    <div style={{ fontSize: 13, color: "var(--text-2)", marginBottom: 4 }}>
                      £{Number(cls.cost).toFixed(2)}
                    </div>
                  )}
                  {occurrences.length === 0 ? (
                    <div style={{ fontSize: 12, color: "var(--text-2)", marginBottom: 8 }}>
                      No upcoming dates
                    </div>
                  ) : (
                    <div style={{ marginTop: 6, marginBottom: 8 }}>
                      <div style={{ fontSize: 12, color: "var(--text-2)", marginBottom: 4 }}>Pick a date</div>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                        {occurrences.map(iso => {
                          const chip = fmtChip(iso);
                          const isSelected = pickedDay === iso;
                          const dayBooked = cls.bookings_by_date?.[iso] ?? 0;
                          const dayFull = cls.capacity != null && dayBooked >= cls.capacity;
                          return (
                            <button
                              key={iso}
                              disabled={dayFull}
                              onClick={() => setClassDay(prev => ({ ...prev, [cls.id]: iso }))}
                              style={{
                                minWidth: 48,
                                padding: "6px 10px",
                                borderRadius: 6,
                                border: `1px solid ${isSelected ? "var(--secondary)" : "var(--border)"}`,
                                background: isSelected ? "var(--secondary)" : "var(--surface)",
                                color: isSelected ? "var(--on-secondary)" : "var(--text)",
                                opacity: dayFull ? 0.4 : 1,
                                cursor: dayFull ? "default" : "pointer",
                                fontSize: 12,
                              }}>
                              {chip.dow} {chip.day}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                  {pickedDay && spotsLeft != null && (
                    <div style={{ fontSize: 12, color: isFull ? "var(--error)" : "var(--text-2)", marginBottom: 8 }}>
                      {isFull ? "Fully booked" : `${spotsLeft} place${spotsLeft !== 1 ? "s" : ""} remaining`}
                    </div>
                  )}
                  <button
                    className="btn btn-primary"
                    disabled={isFull || !pickedDay || occurrences.length === 0}
                    style={{
                      opacity: (isFull || !pickedDay) ? 0.4 : 1,
                      cursor:  (isFull || !pickedDay) ? "default" : "pointer",
                    }}
                    onClick={() => !isFull && pickedDay && handleSelectClass(cls, pickedDay)}>
                    {isFull ? "Fully booked" : pickedDay ? "Select" : "Pick a date"}
                  </button>
                </div>
              );
            })}
          </div>
        );
      };

      // ── Confirmation ──────────────────────────────────────────────────────────
      const Confirmation = ({ booking, orgName, onReset }) => (
        <div className="card" style={{ padding: "32px 24px", textAlign: "center" }}>
          <div className="confirm-icon"><IconCheck /></div>
          <div className="confirm-title">
            {booking.type === "event-waitlist"
              ? "Added to waitlist"
              /* A paid booking is confirmed, not requested — saying otherwise
                 after taking someone's money reads as evasive. */
              : booking.paid ? "Booking confirmed" : "Booking requested"}
          </div>
          <div className="confirm-sub">
            {booking.type === "event-waitlist"
              ? `Thanks, ${booking.name}. ${orgName} will be in touch if a place opens up.`
              : booking.paid
              ? `Thanks, ${booking.name}. Your payment went through and ${orgName} has your booking. A confirmation is on its way to your inbox.`
              : `Thanks, ${booking.name}. ${orgName} has received your request and will be in touch to confirm.`}
          </div>
          {/* Booking reference — auto-generated server-side, the customer
              uses this to identify their booking when chasing the provider
              or finding it in the At9 app. Surfaced prominently so it's
              easy to screenshot. Hidden for waitlist (no booking yet). */}
          {booking.reference && booking.type !== "event-waitlist" && (
            <div style={{
              display: "inline-block",
              padding: "10px 16px",
              marginBottom: 20,
              borderRadius: "var(--r-sm)",
              background: "var(--accent-bg)",
              border: "1px solid var(--accent-mid)",
              textAlign: "left",
            }}>
              <div style={{
                fontSize: 10,
                fontWeight: 600,
                letterSpacing: "0.06em",
                textTransform: "uppercase",
                color: "var(--text-2)",
                marginBottom: 2,
              }}>
                Booking reference
              </div>
              <div style={{
                fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
                fontSize: 18,
                fontWeight: 600,
                color: "var(--accent)",
                letterSpacing: "0.04em",
              }}>
                {booking.reference}
              </div>
            </div>
          )}
          <div style={{ marginBottom: 24, background: "var(--accent-bg)", borderRadius: "var(--r-md)",
            padding: "16px 18px", textAlign: "left", border: "1px solid var(--accent-mid)" }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "var(--text)", marginBottom: 6 }}>
              View and manage your bookings
            </div>
            <div style={{ fontSize: 13, color: "var(--text-2)", lineHeight: 1.6, marginBottom: 14 }}>
              Download the At9 app to see your booking, receive updates, and manage future reservations.
            </div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              <a href="https://apps.apple.com/app/id6742573363"
                target="_blank" rel="noopener noreferrer"
                style={{ display: "inline-flex", alignItems: "center", gap: 8, background: "#000",
                  color: "#fff", borderRadius: "var(--r-sm)", padding: "9px 16px",
                  fontSize: 13, fontWeight: 500, textDecoration: "none" }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                </svg>
                App Store
              </a>
              <a href="https://play.google.com/store/apps/details?id=com.at9"
                target="_blank" rel="noopener noreferrer"
                style={{ display: "inline-flex", alignItems: "center", gap: 8, background: "#000",
                  color: "#fff", borderRadius: "var(--r-sm)", padding: "9px 16px",
                  fontSize: 13, fontWeight: 500, textDecoration: "none" }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M3.18 23.76c.3.17.64.24.99.19l12.24-12.24-2.75-2.75L3.18 23.76zM20.7 10.16l-2.56-1.48-3.09 3.09 3.09 3.09 2.58-1.49c.74-.43.74-1.78-.02-2.21zM2.01 1.05C1.86 1.3 1.78 1.62 1.78 2v20c0 .38.08.7.23.95l.12.12L13.38 12v-.27L2.13.93l-.12.12zM14.77 8.43l-1.39-1.39L2.14.93c-.27-.16-.56-.19-.83-.1l11.38 11.38 2.08-3.78z"/>
                </svg>
                Google Play
              </a>
            </div>
          </div>
          <div className="summary" style={{ textAlign: "left", marginBottom: 20 }}>
            {booking.type === "room" && (
              <>
                <div>{fmtDate(booking.checkIn)} — {fmtDate(booking.checkOut)}</div>
                <div>{booking.nights} {booking.nights === 1 ? "night" : "nights"} · {booking.guests} {booking.guests === 1 ? "guest" : "guests"}</div>
              </>
            )}
            {booking.type === "table" && (
              <div>{fmtDow(booking.date)} {booking.date.getUTCDate()} {MONTH_NAMES[booking.date.getUTCMonth()].slice(0,3)} · {booking.time}</div>
            )}
            {booking.type === "appointment" && (
              <>
                <div>{booking.service}</div>
                <div>{fmtDow(booking.date)} {booking.date.getUTCDate()} {MONTH_NAMES[booking.date.getUTCMonth()].slice(0,3)} · {booking.time}</div>
              </>
            )}
            {(booking.type === "event" || booking.type === "event-waitlist") && (
              <>
                <div>{booking.event}</div>
                {booking.date && <div>{fmtDow(booking.date)} {booking.date.getUTCDate()} {MONTH_NAMES[booking.date.getUTCMonth()].slice(0,3)}{booking.time ? ` · ${booking.time}` : ""}</div>}
              </>
            )}
            {booking.type === "class" && (
              <>
                <div>{booking.cls}</div>
                {booking.schedule && <div>{booking.schedule}</div>}
              </>
            )}
          </div>
          <button className="btn btn-ghost" onClick={onReset}>Make another booking</button>
        </div>
      );

      // ── App ───────────────────────────────────────────────────────────────────
      const App = () => {
        const slug = getSlug();
        const [loadState,   setLoadState]   = useState("loading");
        const [org,         setOrg]         = useState(null);
        const [services,    setServices]    = useState([]);
        const [events,      setEvents]      = useState([]);
        const [classes,     setClasses]     = useState([]);
        const [bookingType, setBookingType] = useState(null);
        const [confirmed,   setConfirmed]   = useState(null);

        useEffect(() => {
          if (!slug) { setLoadState("error"); return; }
          fetch(`${WS_URI}/organisations/public/${slug}`)
            .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
            .then((data) => {
              setOrg(data);
              return Promise.all([
                fetch(`${WS_URI}/services/public/${data.id}`).then(r => r.ok ? r.json() : []).catch(() => []),
                fetch(`${WS_URI}/events/public/organisation/${data.id}`).then(r => r.ok ? r.json() : []).catch(() => []),
                fetch(`${WS_URI}/classes/public/organisation/${data.id}`).then(r => r.ok ? r.json() : []).catch(() => []),
              ]).then(([svcData, evtData, clsData]) => {
                setServices(svcData ?? []);
                setEvents(evtData ?? []);
                setClasses(clsData ?? []);
                setLoadState("ready");
              });
            })
            .catch(() => setLoadState("error"));
        }, [slug]);

        // `bookableTypes` comes from the same public endpoint the app uses, so
        // the two surfaces cannot disagree about what this business offers.
        // Falls back to deriving it locally for the moment between deploying
        // this page and the webservice that supplies the field.
        const bookable = org?.bookableTypes ?? null;
        const hasRooms        = bookable ? bookable.includes("room")
                                         : !!org?.entities?.some((e) => e.type === "room");
        const hasTables       = bookable ? bookable.includes("table")
                                         : !!org?.entities?.some((e) => e.type === "table");
        const hasAppointments = bookable ? bookable.includes("appointment") : services.length > 0;
        const hasEvents       = bookable ? bookable.includes("event")       : events.length > 0;
        const hasClasses      = bookable ? bookable.includes("class")       : classes.length > 0;
        // A business can switch online bookings off; the server refuses these
        // too, so this only saves the customer a wasted journey.
        const bookingsOpen    = org?.allowBookings !== false;
        const optionCount     = [hasRooms, hasTables, hasAppointments, hasEvents, hasClasses].filter(Boolean).length;

        return (
          <div className="page">
            <div className="header">
              <div className="header-eyebrow">Booking</div>
              {org && <div className="header-org">{org.name}</div>}
              {!org && loadState === "loading" && (
                <div className="header-org" style={{ color: "var(--text-3)" }}>Loading…</div>
              )}
            </div>

            <div className="content">

              {loadState === "loading" && (
                <div className="state-center">
                  <div className="spinner" />
                  <span style={{ color: "var(--text-2)", fontSize: 14 }}>Loading…</span>
                </div>
              )}

              {loadState === "error" && (
                <div className="state-center">
                  <IconSearch />
                  <div style={{ fontWeight: 600, fontSize: 18 }}>Not found</div>
                  <div style={{ color: "var(--text-2)", fontSize: 14, maxWidth: 260 }}>
                    Check the link and try again, or contact the business directly.
                  </div>
                </div>
              )}

              {loadState === "ready" && confirmed && (
                <Confirmation booking={confirmed} orgName={org.name}
                  onReset={() => { setBookingType(null); setConfirmed(null); }} />
              )}

              {loadState === "ready" && !confirmed && !bookingType && (
                <>
                  {!bookingsOpen ? (
                    <div className="card" style={{ padding: "28px 24px", textAlign: "center" }}>
                      <div className="confirm-title">Not taking bookings</div>
                      <div className="confirm-sub">
                        {org?.name ?? "This business"} isn't accepting online
                        bookings at the moment. Please get in touch with them
                        directly.
                      </div>
                    </div>
                  ) : hasRooms || hasTables || hasAppointments || hasEvents || hasClasses ? (
                    <>
                      {optionCount > 1 && (
                        <p style={{ fontSize: 15, fontWeight: 500, color: "var(--text-2)", marginBottom: 16 }}>
                          What would you like to book?
                        </p>
                      )}
                      <div className="type-grid"
                        style={optionCount === 1 ? { gridTemplateColumns: "1fr" } : undefined}>
                        {hasRooms && (
                          <div className="type-card" onClick={() => setBookingType("room")}>
                            <div className="type-card-icon"><IconMoon /></div>
                            <div className="type-card-label">Book Room</div>
                            <div className="type-card-sub">Select dates</div>
                          </div>
                        )}
                        {hasTables && (
                          <div className="type-card" onClick={() => setBookingType("table")}>
                            <div className="type-card-icon"><IconUtensils /></div>
                            <div className="type-card-label">Book Table</div>
                            <div className="type-card-sub">Select a time</div>
                          </div>
                        )}
                        {hasAppointments && (
                          <div className="type-card" onClick={() => setBookingType("appointment")}>
                            <div className="type-card-icon"><IconClock /></div>
                            <div className="type-card-label">Book Appointment</div>
                            <div className="type-card-sub">Select a service</div>
                          </div>
                        )}
                        {hasEvents && (
                          <div className="type-card" onClick={() => setBookingType("event")}>
                            <div className="type-card-icon"><IconCalendar /></div>
                            <div className="type-card-label">Book Event</div>
                            <div className="type-card-sub">Browse events</div>
                          </div>
                        )}
                        {hasClasses && (
                          <div className="type-card" onClick={() => setBookingType("class")}>
                            <div className="type-card-icon"><IconGraduationCap /></div>
                            <div className="type-card-label">Book a Class</div>
                            <div className="type-card-sub">Weekly sessions</div>
                          </div>
                        )}
                      </div>
                    </>
                  ) : (
                    <div className="state-center">
                      <IconSearch />
                      <div style={{ fontWeight: 600, fontSize: 18 }}>No bookings available</div>
                      <div style={{ color: "var(--text-2)", fontSize: 14, maxWidth: 260 }}>
                        This business hasn't set up online bookings yet. Please contact them directly.
                      </div>
                    </div>
                  )}
                </>
              )}

              {loadState === "ready" && !confirmed && bookingType === "room" && (
                <RoomBooking org={org} entities={org.entities}
                  onBack={() => setBookingType(null)}
                  onDone={(b) => setConfirmed(b)} />
              )}

              {loadState === "ready" && !confirmed && bookingType === "table" && (
                <TableBooking org={org} entities={org.entities}
                  preferences={org.preferences ?? {}}
                  onBack={() => setBookingType(null)}
                  onDone={(b) => setConfirmed(b)} />
              )}

              {loadState === "ready" && !confirmed && bookingType === "appointment" && (
                <AppointmentBooking org={org} services={services}
                  onBack={() => setBookingType(null)}
                  onDone={(b) => setConfirmed(b)} />
              )}

              {loadState === "ready" && !confirmed && bookingType === "event" && (
                <EventBooking org={org} events={events}
                  onBack={() => setBookingType(null)}
                  onDone={(b) => setConfirmed(b)} />
              )}

              {loadState === "ready" && !confirmed && bookingType === "class" && (
                <ClassBooking org={org} classes={classes}
                  onBack={() => setBookingType(null)}
                  onDone={(b) => setConfirmed(b)} />
              )}

            </div>
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
